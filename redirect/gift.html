<!DOCTYPE html>
<html>
<head>
  <title>Redirection…</title>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const rawKey = new URLSearchParams(window.location.search).get("key");
      const baseUrl = "https://store.steampowered.com/account/registerkey";

      // Si le paramètre est absent ou vaut simplement "/", redirige vers la page Steam sans paramètre
      if (!rawKey || rawKey === "/") {
        window.location.href = baseUrl;
        return;
      }

      // Sinon, retire le "/" initial et ajoute la clé à l'URL
      const cleanKey = rawKey.startsWith("/") ? rawKey.slice(1) : rawKey;
      window.location.href = `${baseUrl}?key=${encodeURIComponent(cleanKey)}`;
    });
  </script>
</head>
<body>
  <h1>Redirection…</h1>
  <p>Veuillez patienter pendant la redirection vers Steam…</p>
</body>
</html>
